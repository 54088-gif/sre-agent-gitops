apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crash-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/54088-gif/sre-agent-gitops.git'
    targetRevision: HEAD
    path: apps/crash-app
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
